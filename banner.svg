<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="300"
     viewBox="0 0 1000 300"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Artur Oliveira — Software Developer</title>
  <desc id="desc">
    Banner de Artur Oliveira, estudante de Engenharia de Software e Técnico em Informática.
  </desc>

  <defs>

    <!-- Fundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>

    <!-- Brilho -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity=".045"
        stroke-width="1"
      />

    </pattern>

    <!-- Gradiente do nome -->
    <linearGradient id="name"
                    x1="0"
                    x2="1">

      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>

    </linearGradient>

  </defs>


  <!-- Fundo -->
  <rect
    width="1000"
    height="300"
    rx="24"
    fill="url(#bg)"
  />

  <!-- Grid -->
  <rect
    width="1000"
    height="300"
    rx="24"
    fill="url(#grid)"
  />


  <!-- Brilho lateral -->
  <circle
    cx="820"
    cy="145"
    r="190"
    fill="url(#glow)"
  />


  <!-- Detalhes dos cantos -->

  <path
    d="
      M35 65V35H105
      M895 35H965V65
      M35 235V265H105
      M895 265H965V235
    "
    fill="none"
    stroke="#22d3ee"
    stroke-width="2"
    stroke-linecap="round"
  />


  <!-- Indicador -->

  <circle
    cx="62"
    cy="78"
    r="4"
    fill="#22d3ee">

    <animate
      attributeName="opacity"
      values="1;.3;1"
      dur="2s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- Identificação -->

  <text
    x="80"
    y="83"
    fill="#22d3ee"
    font-family="monospace"
    font-size="12"
    letter-spacing="2">

    ARTUR OLIVEIRA / DEV

  </text>


  <!-- Nome -->

  <text
    x="60"
    y="155"
    fill="url(#name)"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="52"
    font-weight="700">

    Artur Oliveira

  </text>


  <!-- Cargo -->

  <text
    x="63"
    y="195"
    fill="#cbd5e1"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="21">

    Estudante de Engenharia de Software

  </text>


  <!-- Tecnologias -->

  <text
    x="63"
    y="230"
    fill="#22d3ee"
    font-family="monospace"
    font-size="12"
    letter-spacing="1">

    PYTHON · PHP · JAVASCRIPT · SQL · WEB

  </text>


  <!-- TERMINAL -->

  <g transform="translate(680 82)">

    <!-- Janela -->

    <rect
      width="250"
      height="145"
      rx="12"
      fill="#050b14"
      stroke="#38bdf8"
      stroke-opacity=".25"
    />


    <!-- Barra -->

    <rect
      width="250"
      height="30"
      rx="12"
      fill="#0d1726"
    />

    <rect
      y="18"
      width="250"
      height="12"
      fill="#0d1726"
    />


    <!-- Botões -->

    <circle
      cx="18"
      cy="15"
      r="4"
      fill="#ef4444"
    />

    <circle
      cx="32"
      cy="15"
      r="4"
      fill="#eab308"
    />

    <circle
      cx="46"
      cy="15"
      r="4"
      fill="#22c55e"
    />


    <!-- Código -->

    <text
      x="18"
      y="58"
      fill="#64748b"
      font-family="monospace"
      font-size="11">

      &lt;developer&gt;

    </text>


    <text
      x="18"
      y="80"
      fill="#38bdf8"
      font-family="monospace"
      font-size="11">

      const developer =

    </text>


    <text
      x="18"
      y="101"
      fill="#f8fafc"
      font-family="monospace"
      font-size="11">

      "Artur";

    </text>


    <text
      x="18"
      y="123"
      fill="#22d3ee"
      font-family="monospace"
      font-size="11">

      &lt;/developer&gt;

    </text>


    <!-- Cursor -->

    <rect
      x="111"
      y="113"
      width="6"
      height="13"
      fill="#22d3ee">

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"
      />

    </rect>

  </g>

